name: hdb_resale
version: "1.0.0"

# Which entry in profiles.yml to connect with
profile: hdb_resale

models:
  hdb_resale:
    # Write model and column descriptions into Postgres as COMMENTs,
    # so psql (\d+) and the dashboard see them without the docs site
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging        # see macros/generate_schema_name.sql
      +materialized: view     # light cleanup only; always reflects the latest raw load
    marts:
      +schema: marts
      +materialized: table    # public interface for the dashboard; stored for fast reads

# Folders removed by `dbt clean`
clean-targets:
  - target
  - dbt_packages
