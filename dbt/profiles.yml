# Connection settings for dbt. Committed to git: it holds no secrets, only
# references to the same WAREHOUSE_* environment variables the loader uses.
# dbt doesn't read .env itself; run it with: uv run --env-file ../.env dbt <command>
hdb_resale:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4
