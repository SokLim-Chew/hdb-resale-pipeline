version: 2

models:
  - name: stg_hdb_resale
    description: >
      One row per HDB resale transaction. Typed and renamed from raw.hdb_resale;
      remaining_lease and storey_range parsed into numbers.
    columns:
      - name: source_row_id
        description: data.gov.sg row id. Traceability only; not stable across dataset republishes.
        data_tests: [not_null, unique]
      - name: transaction_month
        description: "{{ doc('transaction_month') }}"
        data_tests: [not_null]
      - name: town
        description: "{{ doc('town') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ANG MO KIO
                  - BEDOK
                  - BISHAN
                  - BUKIT BATOK
                  - BUKIT MERAH
                  - BUKIT PANJANG
                  - BUKIT TIMAH
                  - CENTRAL AREA
                  - CHOA CHU KANG
                  - CLEMENTI
                  - GEYLANG
                  - HOUGANG
                  - JURONG EAST
                  - JURONG WEST
                  - KALLANG/WHAMPOA
                  - MARINE PARADE
                  - PASIR RIS
                  - PUNGGOL
                  - QUEENSTOWN
                  - SEMBAWANG
                  - SENGKANG
                  - SERANGOON
                  - TAMPINES
                  - TOA PAYOH
                  - WOODLANDS
                  - YISHUN
              config:
                severity: warn
      - name: flat_type
        description: "{{ doc('flat_type') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1 ROOM
                  - 2 ROOM
                  - 3 ROOM
                  - 4 ROOM
                  - 5 ROOM
                  - EXECUTIVE
                  - MULTI-GENERATION
      - name: flat_model
        description: "{{ doc('flat_model') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 2-room
                  - 3Gen
                  - Adjoined flat
                  - Apartment
                  - DBSS
                  - Improved
                  - Improved-Maisonette
                  - Maisonette
                  - Model A
                  - Model A2
                  - Model A-Maisonette
                  - Multi Generation
                  - New Generation
                  - Premium Apartment
                  - Premium Apartment Loft
                  - Premium Maisonette
                  - Simplified
                  - Standard
                  - Terrace
                  - Type S1
                  - Type S2
              config:
                severity: warn
      - name: block
        description: "{{ doc('block') }}"
        data_tests: [not_null]
      - name: street_name
        description: "{{ doc('street_name') }}"
        data_tests: [not_null]
      - name: storey_range
        description: "{{ doc('storey_range') }}"
        data_tests: [not_null]
      - name: storey_min
        description: "{{ doc('storey_min') }}"
        data_tests: [not_null]
      - name: storey_max
        description: "{{ doc('storey_max') }}"
        data_tests: [not_null]
      - name: floor_area_sqm
        description: "{{ doc('floor_area_sqm') }}"
        data_tests: [not_null]
      - name: lease_commence_year
        description: "{{ doc('lease_commence_year') }}"
        data_tests: [not_null]
      - name: remaining_lease_months
        description: "{{ doc('remaining_lease_months') }}"
        data_tests: [not_null]
      - name: resale_price
        description: "{{ doc('resale_price') }}"
        data_tests: [not_null]
      - name: price_per_sqm
        description: "{{ doc('price_per_sqm') }}"
        data_tests: [not_null]
      - name: _loaded_at
        description: "{{ doc('_loaded_at') }}"
        data_tests: [not_null]
