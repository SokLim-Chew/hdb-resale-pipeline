# Local stack for sg-hdb-resale-pipeline
#
#   docker compose up -d                     -> warehouse only (Phases 1-4)
#   docker compose --profile airflow up -d   -> warehouse + Airflow (Phase 5+)
#   docker compose down                      -> stop (data kept in volumes)
#   docker compose down -v                   -> stop AND delete all data

services:
  # ---------------------------------------------------------------
  # Analytics warehouse: raw data lands here, dbt builds models here
  # ---------------------------------------------------------------
  warehouse:
    image: postgres:17
    container_name: hdb_warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  # Airflow metadata DB: kept separate from the warehouse on purpose,
  # the same way it would be in a real company setup.
  # ---------------------------------------------------------------
  airflow-db:
    image: postgres:17
    container_name: airflow_metadata_db
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  # Airflow 3 in "standalone" mode: api-server, scheduler, dag-processor
  # and triggerer in ONE container. Fine for local learning; production
  # would split these into separate services.
  # UI: http://localhost:8080
  # ---------------------------------------------------------------
  airflow:
    image: apache/airflow:3.3.2
    container_name: airflow
    profiles: ["airflow"]
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local dev only: skip the login screen
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Airflow connection to the warehouse, usable in DAGs as conn_id="warehouse"
      AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse:5432/${WAREHOUSE_DB}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./dbt:/opt/airflow/dbt

volumes:
  warehouse_data:
  airflow_db_data:
